[workspace]
resolver = "2"
members = [
    "crates/brachio-core",
    "crates/brachio-process",
    "crates/brachio-pty",
    "crates/brachio-runtime",
    "crates/brachio-git",
    "crates/brachio-agent",
    "crates/brachio-qa",
    "crates/brachio-store",
    "crates/brachio-mcp",
    "crates/brachio-cli",
    "src-tauri",
]
# src-tauri needs WebView2 (Windows) or WKWebView (macOS) to build, so a plain
# `cargo test` at the root only covers the platform-independent crates.
default-members = [
    "crates/brachio-core",
    "crates/brachio-process",
    "crates/brachio-pty",
    "crates/brachio-runtime",
    "crates/brachio-git",
    "crates/brachio-agent",
    "crates/brachio-qa",
    "crates/brachio-store",
    "crates/brachio-mcp",
    "crates/brachio-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/4n5rud/Brachio"

[workspace.dependencies]
brachio-core = { path = "crates/brachio-core" }
brachio-process = { path = "crates/brachio-process" }
brachio-pty = { path = "crates/brachio-pty" }
brachio-git = { path = "crates/brachio-git" }
brachio-agent = { path = "crates/brachio-agent" }
brachio-qa = { path = "crates/brachio-qa" }
brachio-store = { path = "crates/brachio-store" }
brachio-mcp = { path = "crates/brachio-mcp" }
brachio-runtime = { path = "crates/brachio-runtime" }
anyhow = "1"
base64 = "0.22"
thiserror = "2"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
portable-pty = "0.9"
rusqlite = { version = "0.43", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

# Lints that enforce docs/rust-style.md (Google's Rust style guide, adapted).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
unwrap_used = "deny"
wildcard_imports = "warn"
enum_glob_use = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
redundant_clone = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
manual_assert = "warn"
uninlined_format_args = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
