[package]
name = "brachio-app"
description = "Brachio desktop app shell (Tauri 2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "brachio_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
brachio-core.workspace = true
brachio-pty.workspace = true
brachio-git.workspace = true
brachio-agent.workspace = true
brachio-store.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
