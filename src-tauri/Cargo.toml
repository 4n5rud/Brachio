[package]
name = "brachio-app"
description = "Brachio desktop app shell (Tauri 2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "brachio_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
brachio-core.workspace = true
brachio-fs.workspace = true
brachio-pty.workspace = true
brachio-git.workspace = true
brachio-process.workspace = true
brachio-agent.workspace = true
brachio-runtime.workspace = true
brachio-store.workspace = true
brachio-qa.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "=2.3.3"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
interprocess = { version = "2.4.8", features = ["tokio"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tokio.workspace = true
tracing.workspace = true
trash = "5"
tracing-subscriber.workspace = true
uuid.workspace = true

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
keepawake = { version = "=0.6.1", default-features = false }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }
