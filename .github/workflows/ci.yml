name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  # The app is built for Windows and macOS only. Linux checks the crates that do not need a
  # web view, and the runtime's Unix socket transport.
  rust-linux:
    name: Rust (ubuntu-24.04, without the app shell)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Lint
        run: cargo clippy --workspace --exclude brachio-app --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --exclude brachio-app --locked

  ui:
    name: UI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm --dir ui typecheck
      - run: pnpm --dir ui test
      - run: pnpm --dir ui build

  # One version, kept in two files. Only a release changes it.
  versions:
    name: Version files agree
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Compare Cargo.toml and ui/package.json
        run: |
          cargo_version=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          ui_version=$(node -p "require('./ui/package.json').version")
          echo "Cargo.toml: $cargo_version"
          echo "ui/package.json: $ui_version"
          test "$cargo_version" = "$ui_version"
      - name: Public documents
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-public-docs.mjs --links
      - name: Size and dependency baseline (report only)
        continue-on-error: true
        run: node scripts/size-baseline.mjs >> "$GITHUB_STEP_SUMMARY"
