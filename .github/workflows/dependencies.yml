name: Dependencies

# Advisory checks for Cargo.lock and ui/pnpm-lock.yaml. The policy (what fails, how to add an
# exception) is in .github/CONTRIBUTING.md#dependency-checks. Runs when a pull request touches
# dependencies or workflows, on main, and every week, because new advisories appear for
# dependencies that did not change.
on:
  pull_request:
    paths: &dependency-paths
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "deny.toml"
      - "rust-toolchain.toml"
      - "ui/package.json"
      - "ui/pnpm-lock.yaml"
      - "ui/pnpm-workspace.yaml"
      - "scripts/check-advisory-exceptions.mjs"
      - ".github/dependabot.yml"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths: *dependency-paths
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: dependencies-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  exceptions:
    name: Advisory exceptions not expired
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/check-advisory-exceptions.mjs

  cargo:
    name: Cargo advisories (cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check advisories
          # Features and targets come from deny.toml.
          arguments: --locked

  pnpm:
    name: UI advisories (pnpm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Shipped code: dependencies end up in the app bundle, so moderate or worse fails.
      - name: Production dependencies (fails on moderate or higher)
        run: pnpm --dir ui audit --prod --audit-level moderate
      # Build and test tools run only on developer machines and CI, so only high or critical fails.
      - name: Development dependencies (fails on high or higher)
        run: pnpm --dir ui audit --dev --audit-level high
