name: Release

# A maintainer pushes a tag such as v0.1.0 or v0.1.0-rc.1 after merging the version change.
# The workflow checks the tag, drafts a GitHub release with generated notes, builds the
# installers and attaches them. The release stays a draft until a maintainer publishes it.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check the tag and draft the release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Check the tag against the version files and main
        id: tag
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cargo_version=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          ui_version=$(node -p "require('./ui/package.json').version")
          if [ "$version" != "$cargo_version" ] || [ "$version" != "$ui_version" ]; then
            echo "Tag $GITHUB_REF_NAME, Cargo.toml $cargo_version and ui/package.json $ui_version must match."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME is not on main."
            exit 1
          fi
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Draft the release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tag.outputs.version }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving its notes alone."
            exit 0
          fi
          flags=(--draft --generate-notes --verify-tag --title "Brachio $VERSION")
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          else
            # A stable release lists everything since the previous stable one, release candidates included.
            previous=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // ""')
            if [ -n "$previous" ]; then
              flags+=(--notes-start-tag "$previous")
            fi
          fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}"

  build:
    name: Installers (${{ matrix.os }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            extra_args: --config src-tauri/tauri.release.windows.conf.json
          - os: macos-latest
            extra_args: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # MSI only accepts a numeric pre-release suffix, so a release candidate ships the NSIS installer alone.
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.extra_args }} ${{ matrix.os == 'windows-latest' && needs.prepare.outputs.prerelease == 'true' && '--bundles nsis' || '' }}
          tagName: ${{ github.ref_name }}
          releaseName: Brachio ${{ needs.prepare.outputs.version }}
          releaseDraft: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}

  checksums:
    name: Attach SHA-256 checksums
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Compute SHA256SUMS.txt for the installers and upload it to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir bundles
          gh release download "$GITHUB_REF_NAME" --dir bundles \
            --pattern '*.exe' --pattern '*.msi' --pattern '*.dmg'
          cd bundles
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber
