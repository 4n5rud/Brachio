<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>preview</title>
<style>
body{background:var(--color-canvas);padding:16px;}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
.col{display:grid;gap:12px;}
.cap{font:var(--text-xs)/1.5 var(--font-mono);color:var(--color-text-3);min-width:72px;}
.panel{background:var(--color-panel);border:1px solid var(--color-line);}

</style></head>
<body>
<div class="panel" style="border-radius:9px;overflow:hidden">
<div class="titlebar" style="padding-left:80px"><svg width="52" height="12" viewBox="0 0 52 12" style="position:absolute;left:14px" aria-hidden="true"><circle cx="6" cy="6" r="6" fill="var(--color-line-strong)"/><circle cx="26" cy="6" r="6" fill="var(--color-line-strong)"/><circle cx="46" cy="6" r="6" fill="var(--color-line-strong)"/></svg>
<button class="repo-switch"><svg class="icon-sm" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4.5h4l1.5 1.5H14v6.5H2z"/></svg>brachio<svg class="icon-xs" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button>
<div class="search" style="width:280px"><svg class="icon-sm" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>Search tasks and branches<kbd>⌘K</kbd></div>
<div class="titlebar-end"><div class="segmented"><button aria-pressed="true"><svg class="icon-sm" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 4h8M5.5 8h8M5.5 12h8"/><circle cx="2.8" cy="4" r=".6" fill="currentColor"/><circle cx="2.8" cy="8" r=".6" fill="currentColor"/><circle cx="2.8" cy="12" r=".6" fill="currentColor"/></svg>Tasks</button><button aria-pressed="false"><svg class="icon-sm" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1"/><rect x="9" y="9" width="4.5" height="4.5" rx="1"/></svg>Board</button></div>
<button class="icon-button" aria-label="Notifications"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11V7.2a4 4 0 0 1 8 0V11l1.2 1.5H2.8z"/><path d="M6.6 14.2h2.8"/></svg><span class="count-badge">2</span></button><button class="icon-button" aria-label="Settings"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/><circle cx="6" cy="4.5" r="1.4" fill="var(--color-panel)"/><circle cx="10.5" cy="8" r="1.4" fill="var(--color-panel)"/><circle cx="5" cy="11.5" r="1.4" fill="var(--color-panel)"/></svg></button></div></div></div>
</body>
</html>
