<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Notice</title><style>body{background:var(--color-canvas);padding:16px;margin:0}</style></head>
<body>
<div style="display:grid;gap:8px;border:1px solid var(--color-line);border-radius:9px;overflow:hidden"><div class="notice notice-info" role="status"><svg class="glyph" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.2" fill="none" stroke="var(--color-status-neutral)" stroke-width="1.6" stroke-dasharray="2 2"/></svg><span><strong>Last screen recovered</strong></span></div><div class="notice notice-info" role="status"><svg class="glyph glyph-spin" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="none" stroke="var(--color-status-working)" stroke-opacity=".28" stroke-width="1.8"/><path d="M6 1.5a4.5 4.5 0 0 1 4.5 4.5" fill="none" stroke="var(--color-status-working)" stroke-width="1.8" stroke-linecap="round"/></svg><span>Starting the saved conversation</span></div><div class="notice notice-blocked" role="status"><svg class="glyph" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 .8 11.2 6 6 11.2.8 6z" fill="var(--color-status-blocked)"/></svg><span><strong>The previous launch outcome is unknown.</strong> Its agent may still be running.</span><div class="notice-actions"><button class="button button-sm">Forget previous launch</button><button class="button button-ghost button-sm">Keep waiting</button></div></div><div class="notice notice-error" role="status"><svg class="glyph" viewBox="0 0 12 12" aria-hidden="true"><rect x="1.2" y="1.2" width="9.6" height="9.6" rx="2" fill="var(--color-status-error)"/><path d="m4.2 4.2 3.6 3.6m0-3.6L4.2 7.8" stroke="var(--color-panel)" stroke-width="1.4" stroke-linecap="round"/></svg><span><strong>Lost the connection to the terminal runtime</strong></span><div class="notice-actions"><button class="button button-primary button-sm">Reopen session</button></div></div></div>
</body>
</html>
