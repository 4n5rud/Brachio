<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ThemePicker</title><style>body{background:var(--color-canvas);padding:16px;margin:0}</style></head>
<body>
<div style="max-width:640px;display:grid;gap:12px"><div class="segmented" style="justify-self:start"><button aria-pressed="true"><svg class="icon-sm" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="2.8"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"/></svg>System</button><button aria-pressed="false">Light</button><button aria-pressed="false">Dark</button></div><div class="swatches" role="radiogroup" aria-label="Color theme"><button class="swatch" role="radio" aria-checked="true"><div class="swatch-art" style="background:#1b1b20"><div class="sb" style="background:#141418"></div><div class="mn"><i style="background:#ececf1;width:70%;opacity:.9"></i><i style="background:#ececf1;width:45%;opacity:.45"></i><i class="btn" style="background:#98e0bf"></i></div></div><div class="swatch-name">Mint<span class="check"><svg class="icon-sm" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3.5 8.5 3 3 6-7"/></svg></span></div></button><button class="swatch" role="radio" aria-checked="false"><div class="swatch-art" style="background:#1b1a28"><div class="sb" style="background:#141320"></div><div class="mn"><i style="background:#eeedf6;width:70%;opacity:.9"></i><i style="background:#eeedf6;width:45%;opacity:.45"></i><i class="btn" style="background:#bcaaf7"></i></div></div><div class="swatch-name">Lilac</div></button><button class="swatch" role="radio" aria-checked="false"><div class="swatch-art" style="background:#1f1c18"><div class="sb" style="background:#171512"></div><div class="mn"><i style="background:#f2ece4;width:70%;opacity:.9"></i><i style="background:#f2ece4;width:45%;opacity:.45"></i><i class="btn" style="background:#86cadb"></i></div></div><div class="swatch-name">Sand</div></button><button class="swatch" role="radio" aria-checked="false"><div class="swatch-art" style="background:#0c0c0e"><div class="sb" style="background:#000000"></div><div class="mn"><i style="background:#ffffff;width:70%;opacity:.9"></i><i style="background:#ffffff;width:45%;opacity:.45"></i><i class="btn" style="background:#ffffff"></i></div></div><div class="swatch-name">Contrast</div></button></div></div>
<script>
// Mark the swatch of the theme this page is showing.
(function(){var t=(document.documentElement.getAttribute("data-theme")||"mint-dark").split("-")[0];
document.querySelectorAll(".swatch").forEach(function(b){var n=b.querySelector(".swatch-name");var on=n&&n.textContent.trim().toLowerCase().indexOf(t)===0;
b.setAttribute("aria-checked",on?"true":"false");var c=b.querySelector(".check");if(c)c.style.display=on?"":"none";
if(on&&!c&&n){n.insertAdjacentHTML("beforeend",'<span class="check"><svg class="icon-sm" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3.5 8.5 3 3 6-7"/></svg></span>');}});})();
</script>
</body>
</html>
