<!-- @dsCard group="Tasks" height=440 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>preview</title>
<style>
body{background:var(--color-canvas);padding:16px;}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
.col{display:grid;gap:12px;}
.cap{font:var(--text-xs)/1.5 var(--font-mono);color:var(--color-text-3);min-width:72px;}
.panel{background:var(--color-panel);border:1px solid var(--color-line);}
.list{width:288px;max-width:100%;background:var(--color-panel);border:1px solid var(--color-line);padding:4px 0 10px;}
</style></head>
<body>
<div class="list">
<button class="group-head group-head-needs"><svg class="icon-xs" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>Needs you <span class="count">2</span></button>
<button class="task-item task-item-selected"><svg class="glyph" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 .8 11.2 6 6 11.2.8 6z" fill="var(--color-status-blocked)"/></svg><span class="task-title">Add rate limit to the login endpoint</span><span class="task-age">now</span>
<span class="task-meta"><span class="agent-chip">Claude Code</span><span class="task-branch">rate-limit-7f2a</span><span class="diffstat"><span class="diffstat-add">+128</span><span class="diffstat-del">−14</span></span></span><span class="task-note task-note-blocked">Wants to run cargo test -p auth</span></button>
<button class="task-item"><svg class="glyph" viewBox="0 0 12 12" aria-hidden="true"><rect x="1.2" y="1.2" width="9.6" height="9.6" rx="2" fill="var(--color-status-error)"/><path d="m4.2 4.2 3.6 3.6m0-3.6L4.2 7.8" stroke="var(--color-panel)" stroke-width="1.4" stroke-linecap="round"/></svg><span class="task-title">Migrate settings to TOML</span><span class="task-age">12m</span>
<span class="task-meta"><span class="agent-chip">Codex</span><span class="task-branch">settings-toml-1c9e</span><span class="diffstat"><span class="diffstat-add">+42</span><span class="diffstat-del">−40</span></span></span><span class="task-note task-note-error">Crashed with exit code 101</span></button>
<button class="group-head"><svg class="icon-xs" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>Working <span class="count">1</span></button>
<button class="task-item is-hover"><svg class="glyph glyph-spin" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="none" stroke="var(--color-status-working)" stroke-opacity=".28" stroke-width="1.8"/><path d="M6 1.5a4.5 4.5 0 0 1 4.5 4.5" fill="none" stroke="var(--color-status-working)" stroke-width="1.8" stroke-linecap="round"/></svg><span class="task-title">Split the PTY reader into its own task</span><span class="task-age">3m</span>
<span class="task-meta"><span class="agent-chip">Claude Code</span><span class="task-branch">pty-reader-a01b</span><span class="diffstat"><span class="diffstat-add">+310</span><span class="diffstat-del">−96</span></span></span></button>
<button class="group-head"><svg class="icon-xs" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>Ready for review <span class="count">1</span></button>
<button class="task-item"><svg class="glyph" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.2" fill="none" stroke="var(--color-status-ready)" stroke-width="2"/></svg><span class="task-title">Fix scrollback lost on resize</span><span class="task-age">1h</span>
<span class="task-meta"><span class="agent-chip">Codex</span><span class="task-branch">scrollback-55d0</span><span class="diffstat"><span class="diffstat-add">+18</span><span class="diffstat-del">−3</span></span></span></button>
<button class="group-head"><svg class="icon-xs" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 4 4 4-4 4"/></svg>Done <span class="count">8</span></button>
</div>
</body>
</html>
