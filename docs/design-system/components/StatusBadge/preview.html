<!-- @dsCard group="Status" height=150 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>preview</title>
<style>
body{background:var(--color-canvas);padding:16px;}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
.col{display:grid;gap:12px;}
.cap{font:var(--text-xs)/1.5 var(--font-mono);color:var(--color-text-3);min-width:72px;}
.panel{background:var(--color-panel);border:1px solid var(--color-line);}

</style></head>
<body>
<div class="col">
<div class="row"><span class="status status-working"><svg class="glyph glyph-spin" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="none" stroke="var(--color-status-working)" stroke-opacity=".28" stroke-width="1.8"/><path d="M6 1.5a4.5 4.5 0 0 1 4.5 4.5" fill="none" stroke="var(--color-status-working)" stroke-width="1.8" stroke-linecap="round"/></svg>Working</span><span class="status status-blocked"><svg class="glyph" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 .8 11.2 6 6 11.2.8 6z" fill="var(--color-status-blocked)"/></svg>Needs you</span><span class="status status-ready"><svg class="glyph" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.2" fill="none" stroke="var(--color-status-ready)" stroke-width="2"/></svg>Ready for review</span></div>
<div class="row"><span class="status status-error"><svg class="glyph" viewBox="0 0 12 12" aria-hidden="true"><rect x="1.2" y="1.2" width="9.6" height="9.6" rx="2" fill="var(--color-status-error)"/><path d="m4.2 4.2 3.6 3.6m0-3.6L4.2 7.8" stroke="var(--color-panel)" stroke-width="1.4" stroke-linecap="round"/></svg>Error</span><span class="status status-error"><svg class="glyph" viewBox="0 0 12 12" aria-hidden="true"><rect x="1.2" y="1.2" width="9.6" height="9.6" rx="2" fill="var(--color-status-error)"/><path d="m4.2 4.2 3.6 3.6m0-3.6L4.2 7.8" stroke="var(--color-panel)" stroke-width="1.4" stroke-linecap="round"/></svg>Crashed</span><span class="status status-done"><svg class="glyph" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="5" fill="var(--color-status-neutral)"/><path d="m3.8 6.2 1.5 1.5 3-3.2" fill="none" stroke="var(--color-panel)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Done</span><span class="status status-unknown"><svg class="glyph" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.2" fill="none" stroke="var(--color-status-neutral)" stroke-width="1.6" stroke-dasharray="2 2"/></svg>Unknown</span></div>
<div class="row"><span class="cap">glyph only</span><svg class="glyph glyph-spin" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="none" stroke="var(--color-status-working)" stroke-opacity=".28" stroke-width="1.8"/><path d="M6 1.5a4.5 4.5 0 0 1 4.5 4.5" fill="none" stroke="var(--color-status-working)" stroke-width="1.8" stroke-linecap="round"/></svg><svg class="glyph" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 .8 11.2 6 6 11.2.8 6z" fill="var(--color-status-blocked)"/></svg><svg class="glyph" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.2" fill="none" stroke="var(--color-status-ready)" stroke-width="2"/></svg><svg class="glyph" viewBox="0 0 12 12" aria-hidden="true"><rect x="1.2" y="1.2" width="9.6" height="9.6" rx="2" fill="var(--color-status-error)"/><path d="m4.2 4.2 3.6 3.6m0-3.6L4.2 7.8" stroke="var(--color-panel)" stroke-width="1.4" stroke-linecap="round"/></svg><svg class="glyph" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="5" fill="var(--color-status-neutral)"/><path d="m3.8 6.2 1.5 1.5 3-3.2" fill="none" stroke="var(--color-panel)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><svg class="glyph" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.2" fill="none" stroke="var(--color-status-neutral)" stroke-width="1.6" stroke-dasharray="2 2"/></svg></div>
</div>
</body>
</html>
