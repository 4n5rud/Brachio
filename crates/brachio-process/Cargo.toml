[package]
name = "brachio-process"
description = "Runs helper programs without a console window, input prompts or unbounded waits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
process-wrap = { version = "10", default-features = false, features = ["creation-flags", "job-object", "process-group", "std"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", default-features = false, features = ["Win32_System_Threading"] }
