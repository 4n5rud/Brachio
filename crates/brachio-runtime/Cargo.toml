[package]
name = "brachio-runtime"
description = "Independent owner of Brachio terminal sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
brachio-core.workspace = true
brachio-fs.workspace = true
brachio-pty.workspace = true
clap.workspace = true
interprocess = { version = "2.4.8", features = ["tokio"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
vt100 = "0.18.1"
vte = "0.15"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
widestring = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

[lints]
workspace = true
