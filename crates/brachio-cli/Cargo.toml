brachio-runtime.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
interprocess = { version = "2.4.8", features = ["tokio"] }
uuid.workspace = true
serde_json.workspace = true
tempfile = "3"

[lints]
workspace = true
